name: Databricks CI

on:
  push:
    branches: [main]
    paths:
      - 'databricks/**'
      - 'dlt/**'
      - 'config/asset_types/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'databricks/**'
      - 'dlt/**'
      - 'config/asset_types/**'
      - 'shared/**'

jobs:
  validate:
    name: Validate Databricks Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Databricks Bundle Validate
        run: databricks bundle validate
        # BUGFIX: bundle root moved from databricks/ to the repository
        # root (see databricks.yml) because dlt/ and config/asset_types/
        # live outside databricks/ and DAB cannot reference files outside
        # its bundle root. No working-directory override needed now.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
