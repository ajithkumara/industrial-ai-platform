name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'

env:
  # Terraform Azure auth — secrets stored as AZURE_* in GitHub, mapped to ARM_* for Terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="storage_account_name_override=${{ vars.STORAGE_ACCOUNT_NAME_OVERRIDE }}" \
            -var="ci_principal_object_id=${{ vars.CI_SP_OBJECT_ID }}" \
            -target=module.resource_group \
            -target=module.storage \
            -target=module.eventhub \
            -target=module.access_connector \
            -target=module.rbac \
            -target=module.keyvault \
            -target=module.monitoring \
            -out=tfplan -no-color
        # module.databricks excluded: Unity Catalog resources (storage credential,
        # external location, catalog, schemas) require metastore admin which the
        # CI SP does not have. The Databricks workspace is stable; bundle deploy
        # handles all Databricks-side changes.
        continue-on-error: false

      - name: Post plan summary to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan 📋
            Plan completed. Review the Actions log for full output.
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply + Bundle Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="storage_account_name_override=${{ vars.STORAGE_ACCOUNT_NAME_OVERRIDE }}" \
            -var="ci_principal_object_id=${{ vars.CI_SP_OBJECT_ID }}" \
            -target=module.resource_group \
            -target=module.storage \
            -target=module.eventhub \
            -target=module.access_connector \
            -target=module.rbac \
            -target=module.keyvault \
            -target=module.monitoring \
            -auto-approve

      - name: Export Terraform outputs
        id: tf_outputs
        run: |
          echo "databricks_host=https://$(terraform output -raw databricks_workspace_url)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Databricks Bundle Deploy
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ steps.tf_outputs.outputs.databricks_host }}
          DATABRICKS_TOKEN: ""
          # Explicitly blank out DATABRICKS_TOKEN so the CLI uses Azure SP auth
          # (ARM_* vars set at workflow level). Mixing PAT + Azure SP causes
          # "more than one authorization method configured" error.
          BUNDLE_VAR_storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
        run: |
          unset DATABRICKS_TOKEN
          databricks bundle deploy -t dev
