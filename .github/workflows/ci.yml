name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'

env:
  # Terraform Azure auth — secrets stored as AZURE_* in GitHub, mapped to ARM_* for Terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-terraform" \
            -backend-config="storage_account_name=sttfstate4922m7vk" \
            -backend-config="container_name=terraformstate" \
            -backend-config="key=dev.terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file terraform.tfvars -out=tfplan -no-color
        continue-on-error: false

      - name: Post plan summary to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan 📋
            Plan completed. Review the Actions log for full output.
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply + Bundle Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-terraform" \
            -backend-config="storage_account_name=sttfstate4922m7vk" \
            -backend-config="container_name=terraformstate" \
            -backend-config="key=dev.terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -var-file terraform.tfvars -auto-approve

      - name: Export Terraform outputs
        id: tf_outputs
        run: |
          echo "databricks_host=https://$(terraform output -raw databricks_workspace_url)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Databricks Bundle Deploy
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ steps.tf_outputs.outputs.databricks_host }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
        run: databricks bundle deploy -t dev
