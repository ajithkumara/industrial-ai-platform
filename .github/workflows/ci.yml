name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'databricks/**'
      - 'dlt/**'
      - 'databricks.yml'

env:
  # P1-08: GitHub OIDC auth — ARM_CLIENT_SECRET is gone.
  # Terraform's azurerm provider (use_oidc = true) exchanges the GitHub
  # OIDC token for an Azure access token at plan/apply time.
  # ARM_CLIENT_ID / ARM_TENANT_ID / ARM_SUBSCRIPTION_ID are non-sensitive
  # identifiers → stored as GitHub repository *variables* (not secrets).
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      # P1-08: required for GitHub to issue an OIDC token to this job.
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="storage_account_name_override=${{ vars.STORAGE_ACCOUNT_NAME_OVERRIDE }}" \
            -var="ci_principal_object_id=${{ vars.CI_SP_OBJECT_ID }}" \
            -target=module.resource_group \
            -target=module.storage \
            -target=module.eventhub \
            -target=module.access_connector \
            -target=module.rbac \
            -target=module.keyvault \
            -target=module.monitoring \
            -out=tfplan -no-color 2>&1 | tee /tmp/tfplan.txt
        # module.databricks excluded: Unity Catalog resources (storage credential,
        # external location, catalog, schemas) require metastore admin which the
        # CI SP does not have. The Databricks workspace is stable; bundle deploy
        # handles all Databricks-side changes.
        continue-on-error: false

      # P1-17: Post the real plan diff (not just "plan completed") so
      # reviewers can see exactly what will be created/changed/destroyed.
      - name: Post plan diff to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            } catch (e) {
              planText = '(could not read plan output)';
            }
            // Trim to GitHub comment character limit (65535)
            if (planText.length > 60000) {
              planText = planText.slice(0, 60000) + '\n... (truncated — see Actions log for full output)';
            }
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const body = [
              `#### Terraform Plan ${status}`,
              '',
              '<details><summary>Show full plan diff</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '</details>',
              '',
              `*Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  terraform-apply:
    name: Terraform Apply + Bundle Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      contents: read
      # P1-08: required for GitHub to issue an OIDC token to this job.
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="storage_account_name_override=${{ vars.STORAGE_ACCOUNT_NAME_OVERRIDE }}" \
            -var="ci_principal_object_id=${{ vars.CI_SP_OBJECT_ID }}" \
            -target=module.resource_group \
            -target=module.storage \
            -target=module.eventhub \
            -target=module.access_connector \
            -target=module.rbac \
            -target=module.keyvault \
            -target=module.monitoring \
            -auto-approve

      - name: Export Terraform outputs
        id: tf_outputs
        run: |
          echo "databricks_host=https://$(terraform output -raw databricks_workspace_url)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Databricks Bundle Deploy
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ steps.tf_outputs.outputs.databricks_host }}
          DATABRICKS_TOKEN: ""
          # Explicitly blank out DATABRICKS_TOKEN so the CLI uses Azure SP auth
          # (ARM_* vars set at workflow level). Mixing PAT + Azure SP causes
          # "more than one authorization method configured" error.
          BUNDLE_VAR_storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
        run: |
          unset DATABRICKS_TOKEN
          databricks bundle deploy -t dev

      # P1-16: Post-deploy smoke test — validates the pipeline is actually live
      # after each merge to main. Fails the job (and blocks further deploys)
      # if the DLT pipeline or Databricks workspace is unreachable.
      - name: Smoke test — validate bundle
        working-directory: ${{ github.workspace }}
        env:
          DATABRICKS_HOST: ${{ steps.tf_outputs.outputs.databricks_host }}
          DATABRICKS_TOKEN: ""
          BUNDLE_VAR_storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
        run: |
          unset DATABRICKS_TOKEN
          databricks bundle validate -t dev
          echo "Smoke test: bundle validate passed — workspace reachable and bundle config valid."
