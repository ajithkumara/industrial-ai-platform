bundle:
  name: azure-industrial-ai-platform

# Only the DLT pipeline resource is included in the active production
# deployment. resources/jobs/*.yml (bronze.yml, silver.yml, gold.yml) are
# intentionally NOT included here: they define standalone Databricks Jobs
# that run the exact same dlt/bronze, dlt/silver, dlt/gold source files as
# the DLT pipeline below, which would create a second, uncoordinated
# execution path for the same transformations. They are kept on disk as
# non-production/manual reference resources only (see the header comment
# in each of those files) and are not wired into this bundle.
include:
  - resources/pipelines/*.yml

# config/asset_types/*.yml lives outside this bundle's root directory
# (databricks/), so it is not synced to the workspace by default. It must
# be explicitly included here so the deployed DLT pipeline
# (dlt/silver/flatten_payloads.py, via dlt/common/helpers.py) can reliably
# read it at runtime. The deployed location is consumed deterministically
# through the DLT pipeline's `configuration.asset_types_config_dir` value
# (databricks/resources/pipelines/dlt.yml), not via __file__ traversal.
sync:
  include:
    - ../config/asset_types/**

workspace:
  host: https://adb-7405619577623735.15.azuredatabricks.net
  profile: canada-central-dev

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
