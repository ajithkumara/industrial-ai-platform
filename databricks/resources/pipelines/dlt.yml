resources:
  pipelines:
    industrial_ai_dlt_pipeline:
      name: "Azure Industrial AI DLT Pipeline"

      # BUGFIX: was "dbw_industrial_ai_dev_7405619577623735" (looks like a
      # workspace-name/ID string, not a Unity Catalog catalog name — no such
      # UC catalog is created anywhere in terraform/). Terraform's
      # module.databricks (terraform/modules/databricks/unity_catalog.tf)
      # provisions a UC catalog literally named "industrial_ai".
      #
      # NOTE on schema routing: `target: bronze` is this pipeline's default
      # publish schema. The Bronze table (dlt/bronze/ingest_raw_events.py,
      # "telemetry_bronze") uses that bare default, landing it in
      # industrial_ai.bronze.telemetry_bronze. The Silver and Gold tables
      # (dlt/silver/clean_and_deduplicate.py, dlt/silver/flatten_payloads.py,
      # dlt/gold/asset_health_summary.py) each declare their own
      # fully-qualified `industrial_ai.<schema>.<table>` name instead, so
      # they land in industrial_ai.silver.* / industrial_ai.gold.*
      # regardless of this pipeline-level default (DLT/Lakeflow supports
      # publishing to multiple schemas from a single pipeline via
      # fully-qualified table names).
      catalog: "industrial_ai"
      target: bronze

      development: true
      continuous: false
      photon: true

      # P0-04: Alert on pipeline failure. Without this, a DLT pipeline failure
      # (e.g. DQ expectation abort, Spark OOM, schema mismatch) is invisible
      # until someone manually checks the pipeline UI.
      notifications:
        - email_recipients:
            - aakumara@gmail.com
          alerts:
            - on-update-failure
            - on-flow-failure

      libraries:
        - notebook:
            path: ../../../dlt/bronze/ingest_raw_events.py
        - notebook:
            path: ../../../dlt/silver/clean_and_deduplicate.py
        - notebook:
            path: ../../../dlt/silver/flatten_payloads.py
        - notebook:
            path: ../../../dlt/gold/asset_health_summary.py
        # Research-evidence Gold tables (2026-08) -- see
        # docs/architecture/RESEARCH_GAP_VERIFICATION_AND_TARGET_DESIGN.md
        # Part 6 for the dependency order and what each table serves.
        # mode_history and detection_performance/edge_autonomy/cloud_egress
        # all read only from tables flatten_payloads.py already produces
        # (silver_orchestrator_mode, silver_context_snapshot,
        # silver_bearing_inference_results), so ordering among these five
        # notebooks doesn't matter to DLT's dependency resolution -- it
        # builds the graph from dlt.read() calls, not file order.
        - notebook:
            path: ../../../dlt/gold/mode_history.py
        - notebook:
            path: ../../../dlt/gold/detection_performance.py
        - notebook:
            path: ../../../dlt/gold/edge_autonomy.py
        - notebook:
            path: ../../../dlt/gold/cloud_egress.py
        - notebook:
            path: ../../../dlt/gold/escalation_efficacy.py
        # ML feature dataset + its quarantine complement. Reads only
        # silver_bearing_sensor_telemetry, so it has no ordering dependency
        # on the evidence tables above -- DLT builds the graph from
        # dlt.read() calls, not from file order.
        - notebook:
            path: ../../../dlt/gold/bearing_ml_features.py

      serverless: true

      configuration:
        # Explicit, deterministic path to the deployed config/asset_types/
        # directory, consumed by dlt/silver/flatten_payloads.py via
        # dlt/common/helpers.py's resolve_asset_types_dir() (reads this as
        # a Spark configuration property). The bundle root is the
        # repository root (../databricks.yml, previously
        # databricks/databricks.yml — moved because notebook/config source
        # files under dlt/ and config/ live outside the databricks/
        # subtree, and Databricks Asset Bundles cannot reference files
        # outside the bundle root). ${workspace.file_path} now resolves to
        # the synced repository root, so config/asset_types is a direct
        # child of it — no "../" needed.
        asset_types_config_dir: "${workspace.file_path}/config/asset_types"
        # Explicit, deterministic path to the deployed dlt/common/
        # directory, consumed by dlt/silver/flatten_payloads.py to locate
        # helpers.py without relying on __file__ (which is not defined
        # inside a deployed DLT notebook's execution context — confirmed
        # by NameError at pipeline-run time). Same rationale/pattern as
        # asset_types_config_dir above.
        dlt_common_dir: "${workspace.file_path}/dlt/common"
        # BUGFIX: was "abfss://.../bronze" — a path the consumer never
        # writes to and dlt/bronze/ingest_raw_events.py never previously
        # read anyway (it hardcoded a different path). The consumer's
        # actual landing path (see config/settings.py RAW_FOLDER default,
        # and the ingest_raw_events.py comment this replaces) is
        # raw/telemetry. Now genuinely consumed by
        # dlt/bronze/ingest_raw_events.py via spark.conf.get("bronze_path").
        # PORTABILITY: storage account is the ${var.storage_account_name}
        # bundle variable (declared in ../../../databricks.yml), sourced from
        # the Terraform output `storage_account_name`. No account name is
        # hardcoded here, so the same pipeline deploys against any subscription.
        bronze_path: "abfss://${var.storage_container}@${var.storage_account_name}.dfs.core.windows.net/raw/telemetry/"
        # Force the ABFS driver to authenticate via the Unity Catalog External
        # Location / Access Connector managed identity (OAuth), not account keys.
        spark.hadoop.fs.azure.account.auth.type.${var.storage_account_name}.dfs.core.windows.net: "OAuth"
        spark.hadoop.fs.azure.account.oauth.provider.type.${var.storage_account_name}.dfs.core.windows.net: "org.apache.hadoop.fs.azurebfs.oauth2.MsiTokenProvider"
