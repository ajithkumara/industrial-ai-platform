resources:
  jobs:
    industrial_ai_silver_job:
      name: "Industrial AI Silver Transformation Job"
      tasks:
        - task_key: silver_clean
          notebook_task:
            notebook_path: ../../notebooks/silver/clean_data.py
            source: WORKSPACE
          job_cluster_key: industrial_ai_cluster
        - task_key: silver_deduplicate
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ../../notebooks/silver/deduplicate.py
            source: WORKSPACE
          job_cluster_key: industrial_ai_cluster
      job_clusters:
        - job_cluster_key: industrial_ai_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2
