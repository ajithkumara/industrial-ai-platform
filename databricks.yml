bundle:
  name: azure-industrial-ai-platform

# BUGFIX: this file was previously databricks/databricks.yml, with the
# bundle root at databricks/. That broke `databricks bundle validate` with
# "path ... is not contained in sync root path" for every notebook under
# dlt/ (and would have for config/asset_types/*.yml too) — Databricks
# Asset Bundles can only reference source files that live inside or below
# the directory containing databricks.yml; sync.include/exclude only
# controls which files get uploaded, it does not expand that boundary.
# Since dlt/ and config/asset_types/ are siblings of databricks/, not
# descendants of it, no sync configuration could have fixed this — the
# bundle root itself had to move. Moving databricks.yml to the repository
# root means every existing file under dlt/, config/, and databricks/ is
# now naturally inside the bundle root; no relative notebook paths needed
# to change (databricks/resources/pipelines/dlt.yml's
# ../../../dlt/bronze/... paths already resolved to this same location).

# Only the DLT pipeline resource is included in the active production
# deployment. databricks/resources/jobs/*.yml (bronze.yml, silver.yml,
# gold.yml) are intentionally NOT included here: they define standalone
# Databricks Jobs that run the exact same dlt/bronze, dlt/silver,
# dlt/gold source files as the DLT pipeline below, which would create a
# second, uncoordinated execution path for the same transformations. They
# are kept on disk as non-production/manual reference resources only (see
# the header comment in each of those files) and are not wired into this
# bundle.
include:
  - databricks/resources/pipelines/*.yml
  # CloudForest training + scoring (2026-08). Plain PySpark notebooks,
  # not DLT -- deliberately a separate Job resource, not folded into
  # bronze.yml/silver.yml/gold.yml's excluded pattern above. See
  # databricks/resources/jobs/cloud_forest.yml header comment.
  - databricks/resources/jobs/cloud_forest.yml
  # Edge bearing Isolation Forest baseline: train + freeze threshold on
  # VALIDATION, then a separate one-time TEST evaluation job. Same
  # rationale as cloud_forest.yml above. See
  # databricks/resources/jobs/bearing_isolation_forest.yml header comment.
  - databricks/resources/jobs/bearing_isolation_forest.yml
  # P1-10: Weekly Delta OPTIMIZE/VACUUM maintenance job.
  - databricks/resources/jobs/maintenance.yml
  # P1-15: Daily MLflow model artifact backup job.
  - databricks/resources/jobs/mlflow_backup.yml
  # P1-12: Operational dashboard — Bronze throughput, Silver DQ, quarantine, ML job health.
  - databricks/resources/dashboards/*.yml

# PORTABILITY: the workspace host is NOT hardcoded here. The Databricks CLI
# resolves it from the DATABRICKS_HOST environment variable (or a saved profile
# from `databricks auth login`). Set it from the Terraform output before deploying:
#
#   $env:DATABRICKS_HOST = "https://$(terraform output -raw databricks_workspace_url)"
#   $env:DATABRICKS_BUNDLE_VAR_storage_account_name = terraform output -raw storage_account_name
#   databricks bundle deploy -t dev
#
# In CI, set DATABRICKS_HOST + DATABRICKS_CLIENT_ID + DATABRICKS_CLIENT_SECRET
# as repo secrets for a service principal OAuth flow.
# No personal profile is committed here.
variables:
  storage_account_name:
    description: >-
      ADLS Gen2 storage account backing the lakehouse. Source it from the
      Terraform output `storage_account_name`. Consumed by
      databricks/resources/pipelines/dlt.yml (bronze_path + ABFS OAuth config).
  storage_container:
    description: "ADLS Gen2 filesystem/container for the medallion lake."
    default: "datalake"
  sql_warehouse_id:
    description: >-
      ID of the SQL warehouse backing the P1-12 operational dashboard.
      Find it in Databricks → SQL Warehouses → <warehouse> → Connection details.
      Only required when deploying the dashboard resource.
    default: ""

targets:
  dev:
    mode: development
    default: true

  test:
    mode: development

  prod:
    mode: production
